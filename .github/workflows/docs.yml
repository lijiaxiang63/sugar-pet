name: Docs

# Builds the user guide (docs/, a VitePress site) and publishes it on GitHub
# Pages.  A pull request that touches the guide only builds it; a push to
# main also publishes it.
#
# Once, in the repository: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one is left to finish.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the "last updated" dates come from the history

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Gives the path the site is served under: /sugar-pet, or nothing with
      # a custom domain.
      - uses: actions/configure-pages@v6
        id: pages
        if: github.event_name != 'pull_request'

      - run: npm ci

      - name: Build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          # With a custom domain the base path is empty, which means "/".
          if [ "${{ steps.pages.outcome }}" = success ] && [ -z "$DOCS_BASE" ]; then
            export DOCS_BASE=/
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
