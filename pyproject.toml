[project]
name = "sugar-pet"
version = "0.3.0"
description = "Intensity normalisation methods for brain FDG-PET (Standardized Uptake Global And Regional-normalization)"
readme = "README.md"
authors = [
    { name = "Jiaxiang Li" }
]
license = "MIT"
keywords = ["FDG-PET", "neuroimaging", "intensity normalization", "SUVR"]
requires-python = ">=3.10"
dependencies = [
    "nibabel>=5.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
sugar-pet = "sugar_pet.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
